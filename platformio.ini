[env:hacktor_watch_s3_lgfx]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Keep both ROM loading and the second-stage bootloader in DOUT/40 MHz.
board_build.flash_mode = dout
board_build.f_flash = 40000000L
; Retain the framework's application SDK variant; the custom loader avoids QIO.
board_build.arduino.memory_type = qio_qspi
extra_scripts = pre:tools/use_watch_bootloader.py
upload_speed = 115200

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; 0=off, 1=error, 2=warning, 3=info, 4=debug, 5=verbose
  -D HACKTOR_LOG_LEVEL=0
  ; Arduino and NimBLE diagnostics follow the same switch.
  -D CORE_DEBUG_LEVEL=HACKTOR_LOG_LEVEL

monitor_speed = 115200

lib_deps =
  lovyan03/LovyanGFX@^1.1.12
  h2zero/NimBLE-Arduino@^2.0.0
