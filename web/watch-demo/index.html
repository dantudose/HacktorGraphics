<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Hacktor Watch · Analog / Digital</title>
  <link rel="stylesheet" href="watch-demo.css">
  <script src="watch-demo.js" defer></script>
</head>
<body>
  <main class="watch-demo" aria-label="Hacktor Watch watchface demonstration">
    <canvas id="watch-canvas" width="960" height="1200" role="img"
      aria-label="Front view of Hacktor Watch showing a working analog face and swiping to its digital face">
      Hacktor Watch cycles between its analog and digital watchfaces.
    </canvas>
    <button id="playback-toggle" class="playback" type="button" aria-label="Pause animation" title="Pause animation">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
    </button>
    <p id="demo-status" class="sr-only" role="status">Loading the watch.</p>
  </main>
</body>
</html>
